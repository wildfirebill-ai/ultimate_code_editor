name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump (major | minor | patch)'
        required: true
        default: patch

permissions:
  contents: read

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and package
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: ultimate-editor-${{ matrix.os }}
          path: release/
